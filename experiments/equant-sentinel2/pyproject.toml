[project]
name = "s2sat"
version = "0.1.0"
description = "Спутники на снимках Sentinel-2: предсказание пересечений и детекция"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "sgp4", "skyfield", "skyfield-data", "pyproj", "pystac-client", "rasterio", "matplotlib", "shapely"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["s2sat"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: нужен доступ к Earth Search и S3"]
