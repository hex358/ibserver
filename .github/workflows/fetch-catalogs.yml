name: fetch-catalogs
# Каталоги для автоматического выбора 3D-моделей и TLE засекреченных спутников (хосты закрыты из контейнера Claude).
on:
  push:
    branches: [claude/experiments-repo-hze47d]
    paths: [experiments/equant-sentinel2/data/catalog_request.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download catalogs
        run: |
          D=experiments/equant-sentinel2/data/catalogs; mkdir -p $D
          get() { for i in 1 2 3 4; do curl -fsSL --retry 3 -A "Mozilla/5.0 (research script)" -o "$2" "$1" && return 0; sleep 15; done; echo "FAILED $1"; return 0; }
          # GCAT (J. McDowell, CC BY 4.0): размеры, корпус (bus), форма, тип
          get https://planet4589.org/space/gcat/tsv/cat/satcat.tsv $D/gcat_satcat.tsv
          get https://planet4589.org/space/gcat/tsv/cat/psatcat.tsv $D/gcat_psatcat.tsv
          get https://planet4589.org/space/gcat/tsv/cat/auxcat.tsv $D/gcat_auxcat.tsv
          # TLE засекреченных объектов от наблюдателей (Mike McCants)
          get https://www.prismnet.com/~mmccants/tles/classfd.zip $D/classfd.zip
          get https://www.prismnet.com/~mmccants/tles/inttles.zip $D/inttles.zip
          # SATCAT CelesTrak (тип объекта, RCS)
          get https://celestrak.org/pub/satcat.csv $D/celestrak_satcat.csv
          cd $D; for f in *.zip; do [ -s "$f" ] && unzip -o -q "$f" && rm -f "$f"; done
          for f in *.tsv *.csv; do [ -s "$f" ] && gzip -f -9 "$f"; done
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add experiments/equant-sentinel2/data/catalogs
          git commit -m "Catalogs: GCAT, classified TLE (McCants), CelesTrak SATCAT" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
