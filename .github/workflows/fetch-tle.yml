name: fetch-tle
# Снимок орбит CelesTrak для experiments/equant-sentinel2 (из контейнера Claude CelesTrak недоступен).
on:
  push:
    branches: [claude/experiments-repo-hze47d]
    paths: [experiments/equant-sentinel2/data/tle_request.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download TLE
        run: |
          set -e
          D=experiments/equant-sentinel2/data/tle_snapshots/$(date -u +%Y%m%dT%H%M)
          mkdir -p "$D"
          CT=https://celestrak.org/NORAD/elements
          get() { for i in 1 2 3; do curl -sSf -m 120 -A "s2sat-research" -o "$D/$1" "$2" && return 0; sleep 20; done; echo "FAILED $1" >> "$D/errors.txt"; }
          get supgp_starlink.tle "$CT/supplemental/sup-gp.php?FILE=starlink&FORMAT=tle"
          get gp_starlink.tle    "$CT/gp.php?GROUP=starlink&FORMAT=tle"
          get gp_active.tle      "$CT/gp.php?GROUP=active&FORMAT=tle"
          get sentinel2.tle      "$CT/gp.php?NAME=SENTINEL-2&FORMAT=tle"
          get iss.tle            "$CT/gp.php?CATNR=25544&FORMAT=tle"
          get satcat.csv         "https://celestrak.org/pub/satcat.csv"
          get gp_visual.tle      "$CT/gp.php?GROUP=visual&FORMAT=tle"
          get gp_stations.tle    "$CT/gp.php?GROUP=stations&FORMAT=tle"
          get gp_last30.tle      "$CT/gp.php?GROUP=last-30-days&FORMAT=tle"
          for g in cosmos-1408-debris fengyun-1c-debris iridium-33-debris cosmos-2251-debris; do
            get "debris_$g.tle" "$CT/gp.php?GROUP=$g&FORMAT=tle"
          done
          for f in oneweb planet spire; do
            get "supgp_$f.tle" "$CT/supplemental/sup-gp.php?FILE=$f&FORMAT=tle"
          done
          wc -l "$D"/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add experiments/equant-sentinel2/data/tle_snapshots
          git commit -m "TLE snapshot from CelesTrak" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
